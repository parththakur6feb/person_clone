<!DOCTYPE html>
<html>
<head>
    <title>PersonaForge Debug - Upload Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input, textarea { padding: 8px; width: 300px; }
        .form-help { font-size: 0.9em; color: #666; margin-top: 5px; }
        #file-preview { margin-top: 10px; padding: 10px; background: #f9f9f9; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>PersonaForge Upload Test</h1>
    
    <div class="form-group">
        <label for="data-input-method">Data Input Method:</label>
        <select id="data-input-method" onchange="toggleDataInput()">
            <option value="text">Paste Text Data</option>
            <option value="file">Upload File(s)</option>
        </select>
    </div>
    
    <div class="form-group" id="text-input-group">
        <label for="chat-data">Chat Data:</label>
        <textarea id="chat-data" placeholder="Paste chat logs, messages, or other text data here..."></textarea>
        <small class="form-help">Make sure you have explicit consent to use this data.</small>
    </div>
    
    <div class="form-group" id="file-input-group" style="display: none;">
        <label for="file-upload">Upload Files:</label>
        <input type="file" id="file-upload" multiple accept=".txt,.json,.csv,.zip,.log,.md,.docx,.pdf">
        <small class="form-help">
            Supported formats: TXT, JSON, CSV, ZIP, LOG, MD, DOCX, PDF<br>
            You can select multiple files or upload a ZIP containing chat exports.
        </small>
        <div id="file-preview" style="margin-top: 10px;"></div>
    </div>

    <script>
        function toggleDataInput() {
            const method = document.getElementById('data-input-method').value;
            const textGroup = document.getElementById('text-input-group');
            const fileGroup = document.getElementById('file-input-group');
            
            console.log('Toggling to:', method);
            
            if (method === 'file') {
                textGroup.style.display = 'none';
                fileGroup.style.display = 'block';
                console.log('File upload mode activated');
            } else {
                textGroup.style.display = 'block';
                fileGroup.style.display = 'none';
                console.log('Text input mode activated');
            }
        }
        
        document.getElementById('file-upload').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            const preview = document.getElementById('file-preview');
            
            if (files.length > 0) {
                preview.innerHTML = `
                    <h4>Selected Files:</h4>
                    <ul>
                        ${files.map(file => `<li>${file.name} (${file.type || 'unknown type'})</li>`).join('')}
                    </ul>
                `;
            } else {
                preview.innerHTML = '';
            }
        });
    </script>
</body>
</html>
